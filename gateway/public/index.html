<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Distributed Drawing Board — Mini-RAFT</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #1a1a2e; display: flex; flex-direction: column;
         align-items: center; font-family: 'Segoe UI', sans-serif; color: #eee; }

  header { width: 100%; background: #16213e; padding: 12px 24px;
           display: flex; align-items: center; gap: 16px; border-bottom: 1px solid #0f3460; }
  header h1 { font-size: 18px; font-weight: 600; color: #e94560; }

  #status-badge { font-size: 12px; padding: 4px 12px; border-radius: 20px;
                  background: #333; color: #aaa; margin-left: auto; }
  #status-badge.connected    { background: #1a3a1a; color: #4ade80; border: 1px solid #4ade80; }
  #status-badge.disconnected { background: #3a1a1a; color: #f87171; border: 1px solid #f87171; }
  #status-badge.connecting   { background: #2a2a1a; color: #fbbf24; border: 1px solid #fbbf24; }

  .toolbar { display: flex; align-items: center; gap: 16px;
             padding: 10px 24px; background: #16213e; width: 100%;
             border-bottom: 1px solid #0f3460; }
  .toolbar label { font-size: 13px; color: #aaa; }
  .toolbar input[type=color] { width: 36px; height: 36px; border: none;
    border-radius: 6px; cursor: pointer; background: none; }
  .toolbar input[type=range] { width: 100px; accent-color: #e94560; }
  #brush-size-label { font-size: 13px; min-width: 24px; }

  #clear-btn { margin-left: auto; padding: 6px 16px; border-radius: 6px;
               background: #e94560; border: none; color: #fff;
               font-size: 13px; cursor: pointer; }
  #clear-btn:hover { background: #c73652; }

  canvas { background: #ffffff; cursor: crosshair;
           border: 2px solid #0f3460; margin: 16px; border-radius: 4px; }

  #info { font-size: 12px; color: #666; margin-bottom: 8px; }
</style>
</head>
<body>

<header>
  <h1>🖊 Distributed Drawing Board</h1>
  <span id="status-badge" class="connecting">⟳ Connecting…</span>
</header>

<div class="toolbar">
  <label>Color</label>
  <input type="color" id="color-picker" value="#e94560">

  <label>Size</label>
  <input type="range" id="brush-size" min="1" max="20" value="4">
  <span id="brush-size-label">4</span>

  <button id="clear-btn">Clear Canvas</button>
</div>

<canvas id="canvas" width="900" height="600"></canvas>
<div id="info">Open in multiple tabs to see real-time sync</div>

<script>
// ── CANVAS SETUP ────────────────────────────────────────────────────
const canvas  = document.getElementById('canvas');
const ctx     = canvas.getContext('2d');
const badge   = document.getElementById('status-badge');
const colorPicker = document.getElementById('color-picker');
const brushSlider = document.getElementById('brush-size');
const brushLabel  = document.getElementById('brush-size-label');

brushSlider.addEventListener('input', () => {
  brushLabel.textContent = brushSlider.value;
});

// ── DRAW HELPER ─────────────────────────────────────────────────────
function drawLine(stroke) {
  ctx.beginPath();
  ctx.moveTo(stroke.x1, stroke.y1);
  ctx.lineTo(stroke.x2, stroke.y2);
  ctx.strokeStyle = stroke.color;
  ctx.lineWidth   = stroke.width;
  ctx.lineCap     = 'round';
  ctx.lineJoin    = 'round';
  ctx.stroke();
}

// ── WEBSOCKET ───────────────────────────────────────────────────────
const WS_URL = `ws://${window.location.hostname}:8080`;
let ws       = null;
let drawing  = false;
let lastX    = 0;
let lastY    = 0;

function connect() {
  badge.className = 'connecting';
  badge.textContent = '⟳ Connecting…';

  ws = new WebSocket(WS_URL);

  ws.onopen = () => {
    badge.className = 'connected';
    badge.textContent = '● Connected';
    console.log('[WS] Connected to gateway');
  };

  ws.onmessage = (event) => {
    try {
      const msg = JSON.parse(event.data);

      if (msg.type === 'canvas_state') {
        // Replay all existing strokes on page load
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        msg.strokes.forEach(drawLine);
        console.log('[WS] Canvas state loaded: ' + msg.strokes.length + ' strokes');

      } else if (msg.type === 'stroke') {
        // Draw a stroke sent by the gateway broadcast
        drawLine(msg.stroke);

      } else if (msg.type === 'error') {
        console.warn('[WS] Server error:', msg.code, msg.message);
      }
    } catch (e) {
      console.error('[WS] Failed to parse message', e);
    }
  };

  ws.onclose = () => {
    badge.className = 'disconnected';
    badge.textContent = '✕ Disconnected — reconnecting…';
    console.log('[WS] Disconnected — retrying in 2s');
    setTimeout(connect, 2000); // auto-reconnect
  };

  ws.onerror = (err) => {
    console.error('[WS] Error', err);
  };
}

connect();

// ── MOUSE EVENTS ────────────────────────────────────────────────────
function getPos(e) {
  const rect = canvas.getBoundingClientRect();
  return {
    x: (e.clientX || e.touches[0].clientX) - rect.left,
    y: (e.clientY || e.touches[0].clientY) - rect.top,
  };
}

canvas.addEventListener('mousedown', (e) => {
  drawing = true;
  const pos = getPos(e);
  lastX = pos.x;
  lastY = pos.y;
});

canvas.addEventListener('mousemove', (e) => {
  if (!drawing) return;
  const pos    = getPos(e);
  const stroke = {
    x1:    lastX,
    y1:    lastY,
    x2:    pos.x,
    y2:    pos.y,
    color: colorPicker.value,
    width: parseInt(brushSlider.value),
  };

  // Draw locally immediately (optimistic — no waiting for round-trip)
  drawLine(stroke);

  // Send to gateway → leader → replicate → broadcast back to all others
  if (ws && ws.readyState === WebSocket.OPEN) {
    ws.send(JSON.stringify({ type: 'stroke', stroke }));
  }

  lastX = pos.x;
  lastY = pos.y;
});

canvas.addEventListener('mouseup',    () => { drawing = false; });
canvas.addEventListener('mouseleave', () => { drawing = false; });

// Touch support
canvas.addEventListener('touchstart', (e) => { e.preventDefault(); drawing = true; const p = getPos(e); lastX = p.x; lastY = p.y; });
canvas.addEventListener('touchmove',  (e) => { e.preventDefault(); canvas.dispatchEvent(new MouseEvent('mousemove', { clientX: e.touches[0].clientX, clientY: e.touches[0].clientY })); });
canvas.addEventListener('touchend',   () => { drawing = false; });

// Clear button — just clears local view (does not affect other clients or log)
document.getElementById('clear-btn').addEventListener('click', () => {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
});
</script>
</body>
</html>
